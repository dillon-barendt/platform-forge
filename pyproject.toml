[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "platform-forge"
version = "0.1.0"
description = "Deterministic scaffolding for modern Python platform architectures."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "Platform Forge Contributors" },
]
keywords = ["scaffolding", "cookiecutter", "platform-engineering", "fastapi", "typer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "cookiecutter>=2.6.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "rich>=13.9.0",
  "typer>=0.15.0",
]

[project.optional-dependencies]
ai = ["pydantic-ai>=1.0.0"]
docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.5.0"]
dev = [
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
platform-forge = "platform_forge.cli:app"

[project.urls]
Documentation = "https://github.com/platform-forge/platform-forge#readme"
Issues = "https://github.com/platform-forge/platform-forge/issues"
Source = "https://github.com/platform-forge/platform-forge"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_forge"]

[tool.hatch.build.targets.sdist]
include = [
  "docs",
  "mkdocs.yml",
  "pyproject.toml",
  "README.md",
  "src/platform_forge",
  "tests",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "outputs", "src/platform_forge/templates/cookiecutters", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
packages = ["platform_forge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
