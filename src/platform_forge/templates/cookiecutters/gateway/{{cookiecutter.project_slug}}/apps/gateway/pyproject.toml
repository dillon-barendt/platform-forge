[project]
name = "{{ cookiecutter.gateway_package | replace('_', '-') }}"
version = "0.1.0"
description = "{{ cookiecutter.project_name }} FastAPI gateway"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.gateway_package }}"]
